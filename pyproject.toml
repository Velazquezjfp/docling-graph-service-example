[project]
name = "docling-graph-service"
version = "0.1.0"
description = "Docling ingestion & ontology-grounded graph extraction service (RAG prototype, module 1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling[easyocr]>=2.123,<3",
    "docling-graph>=1.9.1,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "transformers>=4.44",
    "typer>=0.12",
    "anyio>=4",
]

[project.scripts]
dgs = "docling_graph_service.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docling_graph_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs the ZSD pdf, LiteLLM and models (DGS_INTEGRATION=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "ISC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/docling_graph_service/cli.py" = ["B008"]  # typer idiom
"src/docling_graph_service/schemas.py" = ["E741"]  # bbox l/t/r/b is the API
"tests/*" = ["E731", "E741"]
